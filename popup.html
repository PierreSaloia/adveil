<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdVeil</title><link rel="stylesheet" href="ui.css"></head><body class="popup">
<header class="row"><div class="brand"><img src="assets/icon-128.png" alt=""><div><h1>AdVeil</h1><small>Menos anúncios. Mais controle.</small></div></div><span class="pill">0.3</span></header>
<main><div class="hero"><h2 id="host">Carregando…</h2><p id="siteStatus">Consultando proteção</p></div>
<label class="field"><span>AdVeil ligado</span><input class="toggle" id="enabled" type="checkbox" disabled></label>
<label class="field"><span>Proteger este site<small>Inclui subdomínios</small></span><input class="toggle" id="site" type="checkbox" disabled></label>
<label class="field"><span>Compatibilidade neste site<small>Correções contra detectores conhecidos</small></span><input class="toggle" id="compatSite" type="checkbox" disabled></label>
<label class="field"><span>Camuflagem neste site<small>Testes de detecção respondidos localmente</small></span><input class="toggle" id="stealthSite" type="checkbox" disabled></label>
<p id="summary" class="muted"></p>
<p id="status" class="status" role="status" aria-live="polite"></p>
<button id="options" class="secondary wide">Todas as configurações</button></main>
<footer>Ações no ícone são apenas do AdVeil. Outros bloqueadores continuam independentes.</footer><script type="module" src="popup.js"></script></body></html>
